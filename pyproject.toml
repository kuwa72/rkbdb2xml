[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rkbdb2xml"
version = "0.8.5"
description = "Rekordbox のプレイリストを XML エクスポート・楽曲変換する GUI ツール"
readme = "README.md"
authors = [
    {name = "kuwa72", email = "kuwa72@github.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pyrekordbox>=0.4.0",
    "PySide6>=6.5.0",
    "mutagen>=1.47.0",
    "romann>=0.3.0",
    "psutil>=5.9.0",
    # フォーク（性能修正）: fragmede/rekordbox-pdb@ee3bac2 に再パース回避パッチを適用した私家版
    "rekordbox-pdb @ git+https://github.com/kuwa72/rekordbox-pdb.git@b1cdd52d66ac393fa9d90a8b45a3a036317a3b77",
]

[project.urls]
"Homepage" = "https://github.com/kuwa72/rkbdb2xml"
"Bug Tracker" = "https://github.com/kuwa72/rkbdb2xml/issues"

[project.scripts]
"rkbdb2xml-gui" = "rkbdb2xml.gui:main"

[tool.setuptools]
packages = ["rkbdb2xml"]

[flake8]
ignore = ["E203", "E501"]
exclude = [".venv", "__pycache__"]