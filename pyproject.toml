[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rkbdb2xml"
version = "0.7.0"
description = "Rekordbox のプレイリストを XML エクスポート・楽曲変換する GUI ツール"
readme = "README.md"
authors = [
    {name = "kuwa72", email = "kuwa72@github.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "pyrekordbox>=0.4.0",
    "PySide6>=6.5.0",
    "mutagen>=1.47.0",
    "romann>=0.2.0",
    "psutil>=5.9.0",
]

[project.urls]
"Homepage" = "https://github.com/kuwa72/rkbdb2xml"
"Bug Tracker" = "https://github.com/kuwa72/rkbdb2xml/issues"

[project.scripts]
"rkbdb2xml-gui" = "rkbdb2xml.gui:main"

[tool.setuptools]
packages = ["rkbdb2xml"]

[flake8]
ignore = ["E203", "E501"]
exclude = [".venv", "__pycache__"]