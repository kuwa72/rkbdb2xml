name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -e .
          pip install pytest kaitaistruct==0.11
      - name: Test
        run: pytest tests/ -q

  crate-digger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate sample USB export
        run: |
          pip install -e .
          python scripts/gen_sample_export.py /tmp/usb
      - name: Parse with crate-digger
        working-directory: ci/cratedigger
        run: |
          mvn -q -B compile
          mvn -q -B org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=ValidateExport \
            -Dexec.args="/tmp/usb/PIONEER/rekordbox/export.pdb 2 1"
