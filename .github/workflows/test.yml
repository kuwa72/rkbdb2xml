name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # 暗号化 master.db の全シナリオ E2E 用。未設定なら該当テストは
      # skip になる（tests/test_rb6_*_fixture.py）。
      RB6_DB_KEY: ${{ secrets.RB6_DB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libpulse0
      - name: Install
        run: |
          pip install -e .
          pip install pytest kaitaistruct==0.11
      - name: Test
        run: pytest tests/ -q

  crate-digger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate sample USB export
        run: |
          pip install -e .
          python scripts/gen_sample_export.py /tmp/usb
      - name: Parse with crate-digger
        working-directory: ci/cratedigger
        run: |
          mvn -q -B compile
          mvn -q -B org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=ValidateExport \
            -Dexec.args="/tmp/usb/PIONEER/rekordbox/export.pdb 120 3"
